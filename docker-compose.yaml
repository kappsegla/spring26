services:
  postgresql:
    image: postgres:17
    environment:
      - 'POSTGRES_DB=spring26'
      - 'POSTGRES_USER=user'
      - 'POSTGRES_PASSWORD=pw'
    ports:
      - '5432:5432'
  rabbitmq:
    image: 'rabbitmq:latest'
    environment:
      - 'RABBITMQ_DEFAULT_PASS=secret'
      - 'RABBITMQ_DEFAULT_USER=myuser'
    ports:
      - '5672'
