spring.application.name=spring26
spring.mvc.problemdetails.enabled=true
# Matcha namnet i @CircuitBreaker(name = "circuitBreaker", ...)
resilience4j.circuitbreaker.instances.circuitBreaker.sliding-window-size=5
resilience4j.circuitbreaker.instances.circuitBreaker.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.circuitBreaker.failure-rate-threshold=50
# Hur länge den ska vara i OPEN state innan den försöker igen
resilience4j.circuitbreaker.instances.circuitBreaker.wait-duration-in-open-state=5s
management.endpoints.web.exposure.include=health,circuitbreakers,circuitbreakerevents,retries,ratelimiters
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
management.health.ratelimiters.enabled=true
